name: Claude Code PR Review
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run claude-review
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python submissions/issue-4-pr-reviewer/claude_review.py \
            --pr ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --output review.md
      - name: Post review comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import json
          with open('review.md') as f: body = f.read()
          import urllib.request
          url = '${{ github.event.pull_request.comments_url }}'
          req = urllib.request.Request(url, json.dumps({'body': body}).encode(),
            headers={'Authorization': 'Bearer ${{ secrets.GITHUB_TOKEN }}',
                     'Content-Type': 'application/json', 'User-Agent': 'claude-review'})
          urllib.request.urlopen(req)
          print('Review posted!')
          "
